name: Build sideload IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-sideload]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'scripts/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/ios-sideload.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Wumpus-unsigned-IPA
          path: dist/Wumpus-unsigned.ipa
          if-no-files-found: error
